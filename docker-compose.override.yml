# Extra containers for local development.
#
# `astro dev start` merges this file into the Docker Compose configuration that
# the Astro CLI generates. New service names add containers; existing names
# (e.g. `scheduler`) would modify the ones Astro defines.
# Run `astro dev restart` after changing this file.

services:
  # Postgres database for the glucose readings (separate from Airflow's own
  # metadata database). The service name is also the container's hostname on
  # the Docker network, so Airflow connects to it as host `cgm-db`.
  cgm-db:
    # Official Postgres image, major version pinned: the data files on disk can
    # only be read by the same major version, so a silent upgrade would break it.
    image: postgres:17

    # Start this container again whenever the Docker daemon starts (e.g. after
    # a reboot), unless it was stopped on purpose with `astro dev stop`.
    restart: unless-stopped

    # POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB, read by the image to
    # create the superuser and the database. Kept in cgm-db.env, out of git
    # (template: cgm-db.env.example).
    # Applied ONLY on the first start, when the data directory is empty. Changing
    # them later does nothing: change the password with SQL, or delete the
    # volume and start over.
    env_file:
      - ./cgm-db.env

    # host port : container port. Exposes Postgres on localhost:5433 for psql or
    # DBeaver on the host (5432 is taken by Astro's own Postgres). Airflow doesn't
    # use this mapping: it talks to cgm-db:5432 directly over the Docker network.
    ports:
      - "127.0.0.1:5433:5432"

    # Named volume mounted where Postgres 17 keeps its files, so the data lives
    # outside the container and survives stop/restart. On the host it's under
    # /var/lib/docker/volumes/. `astro dev kill` will most likely delete it.
    volumes:
      - cgm_db_data:/var/lib/postgresql/data

    # Astro's network, shared with the scheduler and the other Airflow
    # containers. Containers can only reach each other by name on the same network.
    networks:
      - airflow

  # Shiny dashboard, served on http://localhost:3838.
  dashboard:

    # Published on Docker Hub, built from dashboard/Dockerfile (see docs/ci-cd.md).
    # Pinned to a version, so an update is a deliberate change: update the tag for later images
    # and run `astro dev restart`. If the image isn't on this machine yet,
    # Compose pulls it on start.
    image: migueldonado/cgm-dashboard:0.1.0

    # Same as cgm-db: come back after a reboot unless stopped on purpose.
    restart: unless-stopped

    # Start cgm-db first. This only waits for the container to start, not for
    # Postgres to accept connections; if the app fails on startup, `restart`
    # retries it.
    depends_on:
      - cgm-db

    # Connection settings for db.R (read with Sys.getenv()), from a file kept
    # out of git. Docker network values: host cgm-db and port 5432, not the
    # localhost:5433 mapping, which only exists on the host.
    env_file:
      - ./dashboard/.env

    # host:port:container port. Bound to 127.0.0.1 so only this machine can
    # open it; Shiny listens on 3838 inside the container.
    ports:
      - "127.0.0.1:3838:3838"

    # Same network as cgm-db, so the name cgm-db resolves to its address.
    networks:
      - airflow

# Declares the named volume used above. Without this, Compose fails with
# `service "cgm-db" refers to undefined volume cgm_db_data`.
volumes:
  cgm_db_data:
