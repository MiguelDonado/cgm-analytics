# Continuous Delivery: build the dashboard image and push it to Docker Hub
# (migueldonado/cgm-dashboard) when a version is released. See docs/ci-cd.md.
#
# Everything runs on a fresh GitHub runner, not on the laptop: it checks out the
# repo at the tag, builds dashboard/Dockerfile, logs in with the DOCKERHUB_TOKEN
# secret and pushes. So the image only contains what's committed at that tag,
# and each version on Docker Hub matches one commit.
#
#   git push origin v0.2.0  →  runner: build  →  Docker Hub: 0.2.0 and latest
#
# Releasing a new version:
#   1. Merge the dashboard change into main.
#   2. Bump the image tag in docker-compose.override.yml and the README, merge.
#   3. git tag v0.2.0 && git push origin v0.2.0
#
# Only the dashboard is published: the Airflow image is built from the repo by
# Astro, and it needs the user's own LibreLinkUp credentials anyway.

name: Publish dashboard image

# Runs when a version tag is pushed: git tag v0.2.0 && git push origin v0.2.0
on:
    push:
        tags: ["v*"]

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Set image tag from the git tag: v0.2.0 -> 0.2.0, plus latest
            - name: Compute image tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: migueldonado/cgm-dashboard
                tags: type=semver,pattern={{version}}
            
            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                username: migueldonado
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            # Buildx is Docker's newer build engine (the one behind `docker build`
            # on the laptop too). This step switches it to a mode that can save
            # and reuse layers from earlier runs (cache-from/cache-to below).
            # Without it, every release would rebuild the image from scratch.
            - uses: docker/setup-buildx-action@v3

            # The same as the manual release, in one step:
            #   docker build -t migueldonado/cgm-dashboard:0.2.0 dashboard
            #   docker push migueldonado/cgm-dashboard:0.2.0
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                # Folder to build from, with its Dockerfile: the `dashboard` at
                # the end of `docker build ... dashboard`
                context: dashboard
                # Upload the image to Docker Hub after building it (false would
                # only build it, e.g. to check that the Dockerfile works)
                push: true
                # The names from the "Compute image tags" step (id: meta), one
                # per line: migueldonado/cgm-dashboard:0.2.0 and :latest.
                # Same as several -t flags in `docker build`
                tags: ${{ steps.meta.outputs.tags }}
                # Metadata stored inside the image: source repo, commit, version.
                # `docker inspect` and Docker Hub show where the image came from
                labels: ${{ steps.meta.outputs.labels }}
                # Layer cache in GitHub's cache storage 
                cache-from: type=gha
                cache-to: type=gha,mode=max